name: theapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  url_launcher: ^6.3.0
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5
  flutter_tts: ^4.2.5
  audioplayers: ^6.0.0
  speech_to_text: ^7.4.0
  path_provider: ^2.1.6
  record: ^6.2.1
  web_socket_channel: ^3.0.3
  cached_network_image: ^3.4.1
  fl_chart: ^1.2.0
  flutter_animate: ^4.5.2
  confetti: ^0.8.0
  google_fonts: ^8.2.1
  google_mlkit_text_recognition: 0.16.0
  pdf: ^3.12.0
  printing: ^5.14.3
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#9B0505"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/comic_bg.png
    - assets/sves_logo.jpg
    - assets/audio/

dependency_overrides:
  record_linux: ^1.1.1